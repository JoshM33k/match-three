<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1a5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monster Pop" />
    <meta name="description" content="A cute pixel-art match-three game starring noisy little monsters." />
    <title>Monster Pop</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2a1a5e;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }
      #safe-area {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      noscript {
        color: #fff;
        font: 16px sans-serif;
        position: fixed;
        inset: 40% 0 auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div id="safe-area"></div>
    <noscript>Monster Pop needs JavaScript to play.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
